spring.application.name=servicehub-api

# --- Banco de dados (PostgreSQL) ---
# Valores lidos de variáveis de ambiente; nenhuma senha fica no repositório.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${DB_USER:servicehub}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# O esquema é criado pelas migrations do Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- SpringDoc / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
