# Mensagens dos erros padrão do Spring MVC no formato Problem Details (RFC 9457).
# Chaves: problemDetail.title.<classe da exceção> e problemDetail.<classe da exceção>

problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Corpo da requisição inválido
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=O corpo da requisição está ausente ou não é um JSON válido

problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Parâmetro inválido
problemDetail.org.springframework.beans.TypeMismatchException=O valor informado para o parâmetro ''{0}'' é inválido

problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método não permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=O método HTTP {0} não é suportado para este recurso

problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de conteúdo não suportado
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=O tipo de conteúdo da requisição não é suportado. Use application/json

problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Recurso não encontrado
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=A rota solicitada não existe
